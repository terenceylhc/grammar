<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>關係子句魔法控制器</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f7f4eb; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        .login-box, .game-box { width: 100%; max-width: 500px; background: white; border: 3px solid #1a1a1a; border-radius: 16px; padding: 25px; box-shadow: 4px 4px 0px #1a1a1a; margin-top: 20px; text-align: center; box-sizing: border-box; }
        input { width: 80%; padding: 12px; font-size: 14pt; border: 2px solid #1a1a1a; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .btn { background: #ffd54f; border: 2px solid #1a1a1a; border-radius: 8px; padding: 12px 30px; font-size: 14pt; font-weight: bold; width: 85%; cursor: pointer; box-shadow: 2px 2px 0#1a1a1a; }
        
        .pad-area { background: #fafafa; border: 2px dashed #ccc; min-height: 240px; position: relative; margin-top: 15px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; padding: 20px; box-sizing: border-box; }
        .pad-area.flex-row { flex-direction: row; flex-wrap: wrap; }
        
        .word-token { padding: 8px 14px; font-size: 13pt; font-weight: bold; border: 2px solid #1a1a1a; border-radius: 8px; background: white; box-shadow: 2px 2px 0 #1a1a1a; cursor: pointer; }
        .word-token.selected { background-color: #fff59d; border-color: #fbc02d; transform: translate(1px, 1px); box-shadow: 1px 1px 0 #1a1a1a; }
        .clause-option-btn { width: 100%; padding: 15px 10px; font-size: 13pt; font-weight: bold; text-align: left; border: 3px solid #1a1a1a; border-radius: 12px; background: white; box-shadow: 3px 3px 0px #1a1a1a; cursor: pointer; box-sizing: border-box; }
        .sort-token { width: 100%; padding: 12px; font-size: 13pt; font-weight: bold; border: 2px solid #1a1a1a; border-radius: 8px; background: #fffde7; box-shadow: 3px 3px 0 #1a1a1a; cursor: grab; text-align: center; box-sizing: border-box; touch-action: none; }
        
        .card-row { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .card { width: 100px; padding: 15px 0; font-size: 14pt; font-weight: bold; border: 3px solid #1a1a1a; border-radius: 12px; background: white; box-shadow: 3px 3px 0 #1a1a1a; text-align: center; touch-action: none; }
        #who { background: #ffcdd2; } #which { background: #c8e6c9; } #that { background: #e1bee7; }
        
        .status-msg { font-size: 14pt; font-weight: bold; color: #2e7d32; margin-top: 15px; min-height: 24px; }
        .score-badge { background: #1a1a1a; color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 12pt; display: inline-block; margin-top: 5px;}
    </style>
</head>
<body>

    <div class="login-box" id="login-ui">
        <h2>✨ 競賽控制器登入 ✨</h2>
        <input type="number" id="room-input" placeholder="請輸入4位數教室房號">
        <input type="text" id="name-input" placeholder="請輸入組名 (如: 第一組)">
        <button class="btn" id="join-btn">加入競賽 ➔</button>
    </div>

    <div class="game-box" id="game-ui" style="display:none;">
        <h3 id="welcome-msg" style="margin:5px 0;">隊伍：</h3>
        <div class="score-badge" id="my-score">目前積分：0 分</div>
        <p id="game-guide" style="color: #666; font-size: 11pt; margin-top: 12px; font-weight: bold;"></p>
        
        <div class="pad-area" id="pad"></div>
        <button class="btn" id="submit-t2-btn" style="display:none; margin-top: 15px; background-color: #81c784;">🚀 送出答案驗證！</button>
        <div class="status-msg" id="msg"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOyninxSDT04q1-L3FPWciybdfnJowIwE",
            authDomain: "fire-gamebase.firebaseapp.com",
            databaseURL: "https://fire-gamebase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fire-gamebase",
            storageBucket: "fire-gamebase.firebasestorage.app",
            messagingSenderId: "35029879593",
            appId: "1:35029879593:web:26a7810d1363a72920c538"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let studentId = "st_" + Math.floor(Math.random() * 100000);
        let sName = ""; let roomCode = ""; let studentRef = null;
        let currentTypeKey = ""; let sortableInstance = null;
        let targetAnsStr = "";

        document.getElementById('join-btn').addEventListener('click', () => {
            roomCode = document.getElementById('room-input').value;
            sName = document.getElementById('name-input').value;
            if(!roomCode || !sName) { alert('請完整填寫房號與組名！'); return; }

            const roomCheckRef = database.ref('classrooms/' + roomCode);
            roomCheckRef.once('value', (snapshot) => {
                if(!snapshot.exists()) { alert('找不到此教室！'); } else {
                    document.getElementById('login-ui').style.display = 'none';
                    document.getElementById('game-ui').style.display = 'block';
                    document.getElementById('welcome-msg').innerText = `隊伍：${sName}`;
                    
                    studentRef = database.ref(`classrooms/${roomCode}/students/${studentId}`);
                    studentRef.set({ name: sName, x: 0, y: 0, isDragging: false, card: "", success: false, score: 0 });

                    studentRef.child('score').on('value', snap => {
                        let scoreVal = snap.val() || 0;
                        document.getElementById('my-score').innerText = `目前積分：${scoreVal} 分`;
                    });

                    roomCheckRef.on('value', (snap) => {
                        const data = snap.val(); if(!data) return;

                        if (data.isStarted && !data.isEnded) {
                            targetAnsStr = data.currentAnsStr;
                            if (!data.currentAnsStr) return;

                            if (currentTypeKey !== data.currentQuestion + '_' + data.currentType) {
                                currentTypeKey = data.currentQuestion + '_' + data.currentType;
                                setupInterface(data.currentType, data.fullSentenceText, data.optionsStr);
                            }

                            if (data.answered) {
                                document.getElementById('pad').style.opacity = "0.5";
                                document.getElementById('pad').style.pointerEvents = "none";
                                document.getElementById('submit-t2-btn').disabled = true;
                                if (data.winner === sName) {
                                    document.getElementById('msg').style.color = '#2e7d32'; document.getElementById('msg').innerText = "❤️ 搶答成功！獲得 10 分！";
                                } else {
                                    document.getElementById('msg').style.color = '#666'; document.getElementById('msg').innerText = `😱 被【${data.winner}】率先搶答走囉！`;
                                }
                            } else {
                                document.getElementById('msg').innerText = ""; document.getElementById('submit-t2-btn').disabled = false;
                                document.getElementById('pad').style.opacity = "1"; document.getElementById('pad').style.pointerEvents = "auto";
                            }
                        }
                        if (data.isEnded) {
                            document.getElementById('pad').style.opacity = "0.5"; document.getElementById('pad').style.pointerEvents = "none";
                            document.getElementById('game-guide').innerText = "🏁 比賽結束！請看大螢幕排行榜！";
                        } else if (!data.isStarted) {
                            document.getElementById('pad').style.opacity = "0.5"; document.getElementById('pad').style.pointerEvents = "none";
                            document.getElementById('game-guide').innerText = "🔄 老師已將遊戲室重置，正在準備下一回合，請待命..."; 
                            document.getElementById('msg').innerText = "";
                        }
                    });
                }
            });
        });

        function setupInterface(type, fullText, optsStr) {
            const pad = document.getElementById('pad'); const submitBtn = document.getElementById('submit-t2-btn');
            pad.className = 'pad-area'; pad.innerHTML = '';
            if(sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }

            if (type === 2 && fullText) {
                pad.classList.add('flex-row');
                document.getElementById('game-guide').innerText = "🎯 尋找修飾標靶：請點選出「所有的關係子句單字」！";
                submitBtn.style.display = 'block';
                fullText.split(' ').forEach(word => {
                    const token = document.createElement('div'); token.className = 'word-token'; token.innerText = word;
                    token.setAttribute('data-key', word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,""));
                    token.addEventListener('click', () => { token.classList.toggle('selected'); });
                    pad.appendChild(token);
                });
            } else if (type === 3 && optsStr) {
                document.getElementById('game-guide').innerText = "🧩 文法拆解大師：請點擊合併最正確的關係子句！";
                submitBtn.style.display = 'none';
                optsStr.split('##').forEach(optText => {
                    const optBtn = document.createElement('button'); optBtn.className = 'clause-option-btn';
                    optBtn.innerHTML = `📄 <strong>${optText}</strong>`;
                    optBtn.addEventListener('click', () => {
                        if (optText === targetAnsStr) { studentRef.update({ success: true, card: optText }); } 
                        else { alertWrong("❌ 結構有文法錯誤喔，再想想看！"); }
                    });
                    pad.appendChild(optBtn);
                });
            } else if (type === 5 && optsStr) {
                // 🌟 題型五面版：解鎖智慧發射相容驗證鎖
                document.getElementById('game-guide').innerText = "⚡ 關係子句簡化為分詞片語：點擊正確分詞、搶答發射！";
                submitBtn.style.display = 'none';
                optsStr.split('##').forEach(optText => {
                    const optBtn = document.createElement('button'); optBtn.className = 'clause-option-btn';
                    optBtn.style.borderColor = "#ab47bc"; optBtn.innerHTML = `🔮 分詞簡化發射 ➔ <strong>${optText}</strong>`;
                    optBtn.addEventListener('click', () => {
                        // 🚀 核心修復：使用相容性陣列切割法核對答案，徹底封殺發射無反應 Bug！
                        const pureTarget = targetAnsStr.split(',')[0];
                        if (optText === pureTarget || optText === targetAnsStr) { 
                            studentRef.update({ success: true, card: optText }); 
                        } else { 
                            alertWrong("❌ 分詞主被動判斷錯誤，請重新校對！"); 
                        }
                    });
                    pad.appendChild(optBtn);
                });
            } else if ((type === 4 || type === 6) && optsStr) {
                // 🌟 題型六與題型四：全面啟動最高規格 SortableJS 手機觸控引擎
                if(type === 6) {
                    document.getElementById('game-guide').innerText = "🧲 關係子句簡化為分詞片語：請上下拖曳字塊，排出正確的分詞片語簡化句！";
                } else {
                    document.getElementById('game-guide').innerText = "🧲 高級排列組合：請上下拖曳字塊，排出正確句子！";
                }
                submitBtn.style.display = 'block';
                
                const tokens = optsStr.split('##'); 
                tokens.sort(() => Math.random() - 0.5);
                tokens.forEach(tokText => {
                    const block = document.createElement('div'); block.className = 'sort-token'; block.innerText = tokText;
                    if(type === 6) block.style.background = "#e3f2fd";
                    pad.appendChild(block);
                });
                
                // 🚀 核心修復：強制在軟體層解鎖 HTML5 觸控拖動限制，保證 iPad 與手機 100% 能流暢拉動！
                sortableInstance = new Sortable(pad, { 
                    animation: 150,
                    forceFallback: true,
                    fallbackTolerance: 3
                });
            } else {
                document.getElementById('game-guide').innerText = "🚀 請按住關代卡片向上發射至大螢幕！";
                submitBtn.style.display = 'none';
                const cardRow = document.createElement('div'); cardRow.className = 'card-row';
                cardRow.innerHTML = `<div class="card" id="who" data-val="who">👤 who</div><div class="card" id="which" data-val="which">👜 which</div><div class="card" id="that" data-val="that">⭐ that</div>`;
                pad.appendChild(cardRow);
                initPointerControls();
            }
        }

        document.getElementById('submit-t2-btn').addEventListener('click', () => {
            if (currentTypeKey.endsWith('_2')) {
                const selectedKeys = Array.from(document.querySelectorAll('.word-token.selected')).map(t => t.getAttribute('data-key'));
                if (selectedKeys.join(',') === targetAnsStr) { studentRef.update({ success: true }); } else { alertWrong("❌ 範圍不正確，請重新校對！"); }
            } else if (currentTypeKey.endsWith('_4') || currentTypeKey.endsWith('_6')) {
                const studentOrder = Array.from(document.querySelectorAll('.sort-token')).map(b => b.innerText).join(',');
                if (targetAnsStr.split('||').includes(studentOrder)) { studentRef.update({ success: true, card: studentOrder }); } 
                else { alertWrong("❌ 語順不正確，請再調換一下字塊！"); }
            }
        });

        function alertWrong(warningText) {
            document.getElementById('msg').style.color = '#d32f2f'; document.getElementById('msg').innerText = warningText;
            setTimeout(() => { document.getElementById('msg').innerText = ""; }, 2200);
        }

        function initPointerControls() {
            const cards = document.querySelectorAll('.card'); const pad = document.getElementById('pad');
            cards.forEach(card => {
                let isPointerDown = false; let startX = 0, startY = 0, origLeft = 0, origTop = 0;
                card.addEventListener('pointerdown', (e) => {
                    isPointerDown = true; card.setPointerCapture(e.pointerId);
                    if (card.style.position !== 'absolute') {
                        const rect = card.getBoundingClientRect(); const padRect = pad.getBoundingClientRect();
                        origLeft = rect.left - padRect.left; origTop = rect.top - padRect.top;
                        card.style.position = 'absolute'; card.style.left = origLeft + 'px'; card.style.top = origTop + 'px';
                    } else { origLeft = parseFloat(card.style.left); origTop = parseFloat(card.style.top); }
                    startX = e.clientX; startY = e.clientY;
                });
                card.addEventListener('pointermove', (e) => {
                    if (!isPointerDown) return;
                    let newX = origLeft + (e.clientX - startX); let newY = origTop + (e.clientY - startY);
                    if(newX < 0) newX = 0; if(newX > pad.clientWidth - card.clientWidth) newX = pad.clientWidth - card.clientWidth;
                    if(newY > pad.clientHeight - card.clientHeight) newY = pad.clientHeight - card.clientHeight;
                    card.style.left = newX + 'px'; card.style.top = newY + 'px';
                });
                card.addEventListener('pointerup', (e) => {
                    if (!isPointerDown) return; isPointerDown = false; card.releasePointerCapture(e.pointerId);
                    const val = card.getAttribute('data-val');
                    if (parseInt(card.style.top) < 20) {
                        if (targetAnsStr.split(',').includes(val)) { studentRef.update({ success: true, card: val }); } 
                        else { alertWrong("❌ 關代選錯囉，請再想想！"); resetCards(); }
                    } else { resetCards(); }
                });
            });
        }

        function resetCards() { document.querySelectorAll('.card').forEach(card => { card.style.position = 'relative'; card.style.left = '0px'; card.style.top = '0px'; }); }
    </script>
</body>
</html>
