<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>關係子句魔法控制器</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background-color: #f7f4eb;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            touch-action: none;
        }
        .login-box, .game-box {
            width: 100%;
            max-width: 500px;
            background: white;
            border: 3px solid #1a1a1a;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 4px 4px 0px #1a1a1a;
            margin-top: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        input {
            width: 80%;
            padding: 12px;
            font-size: 14pt;
            border: 2px solid #1a1a1a;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .btn {
            background: #ffd54f;
            border: 2px solid #1a1a1a;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 14pt;
            font-weight: bold;
            width: 85%;
            cursor: pointer;
        }
        .pad-area {
            background: #fafafa;
            border: 2px dashed #ccc;
            height: 280px;
            position: relative;
            margin-top: 20px;
            border-radius: 12px;
            /* 移除 overflow:hidden，並改用 flex 排版達成手機版自適應換行 */
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            gap: 15px;
            padding: 20px 10px;
            box-sizing: border-box;
        }
        .card {
            width: 105px;
            height: 55px;
            line-height: 55px;
            font-size: 15pt;
            font-weight: bold;
            border: 3px solid #1a1a1a;
            border-radius: 12px;
            background: white;
            box-shadow: 3px 3px 0 #1a1a1a;
            text-align: center;
            touch-action: none; /* 停用網頁預設滾動，專注於拖曳 */
            position: relative; /* 初始排版流 */
            z-index: 10;
        }
        #who { background: #ffcdd2; }
        #which { background: #c8e6c9; }
        #that { background: #e1bee7; }
        
        .card.dragging {
            box-shadow: 1px 1px 0 #1a1a1a;
            z-index: 999;
        }
        .status-msg {
            font-size: 14pt;
            font-weight: bold;
            color: #2e7d32;
            margin-top: 15px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="login-box" id="login-ui">
        <h2>✨ 魔法卡控制器登入 ✨</h2>
        <input type="number" id="room-input" placeholder="請輸入4位數教室房號">
        <input type="text" id="name-input" placeholder="請輸入您的座號或姓名">
        <button class="btn" id="join-btn">連線進入教室 ➔</button>
    </div>

    <div class="game-box" id="game-ui" style="display:none;">
        <h3 id="welcome-msg">準備就緒</h3>
        <p style="color: #666; font-size: 11pt;">請用手指或滑鼠將魔法卡片**向上拖曳到頂部**發射至大螢幕！</p>
        
        <div class="pad-area" id="pad">
            <div class="card" id="who" data-val="who">👤 who</div>
            <div class="card" id="which" data-val="which">👜 which</div>
            <div class="card" id="that" data-val="that">⭐ that</div>
        </div>
        <div class="status-msg" id="msg"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOyninxSDT04q1-L3FPWciybdfnJowIwE",
            authDomain: "fire-gamebase.firebaseapp.com",
            databaseURL: "https://fire-gamebase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fire-gamebase",
            storageBucket: "fire-gamebase.firebasestorage.app",
            messagingSenderId: "35029879593",
            appId: "1:35029879593:web:26a7810d1363a72920c538"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let studentId = "st_" + Math.floor(Math.random() * 100000);
        let sName = "";
        let roomCode = "";
        let studentRef = null;
        let currentQuizAns = [];

        const quizAnsKey = [["which", "that"], ["who"], ["which", "that"]];

        document.getElementById('join-btn').addEventListener('click', () => {
            roomCode = document.getElementById('room-input').value;
            sName = document.getElementById('name-input').value;

            if(!roomCode || !sName) { alert('請完整填寫房號與姓名！'); return; }

            const roomCheckRef = database.ref('classrooms/' + roomCode);
            roomCheckRef.once('value', (snapshot) => {
                if(!snapshot.exists()) {
                    alert('找不到此教室，請確認房號是否正確！');
                } else {
                    document.getElementById('login-ui').style.display = 'none';
                    document.getElementById('game-ui').style.display = 'block';
                    document.getElementById('welcome-msg').innerText = `同學：${sName} (房號: ${roomCode})`;
                    
                    studentRef = database.ref(`classrooms/${roomCode}/students/${studentId}`);
                    studentRef.set({ name: sName, x: 0, y: 0, isDragging: false, card: "", success: false });

                    roomCheckRef.child('currentQuestion').on('value', (snap) => {
                        const qIdx = snap.val() || 0;
                        currentQuizAns = quizAnsKey[qIdx];
                        resetCards();
                        document.getElementById('msg').innerText = "";
                    });

                    roomCheckRef.on('value', snap => {
                        const data = snap.val();
                        if (data && data.answered) {
                            document.getElementById('msg').innerText = `🎉 這一題已被 ${data.winner} 答對囉！`;
                        }
                    });

                    initPointerControls();
                }
            });
        });

        function resetCards() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.style.position = 'relative';
                card.style.left = '0px';
                card.style.top = '0px';
                card.classList.remove('dragging');
            });
        }

        // 使用 PointerEvents 全面相容滑鼠拖曳與手指觸控
        function initPointerControls() {
            const cards = document.querySelectorAll('.card');
            const pad = document.getElementById('pad');

            cards.forEach(card => {
                let isPointerDown = false;
                let startX = 0, startY = 0;
                let origLeft = 0, origTop = 0;

                card.addEventListener('pointerdown', (e) => {
                    isPointerDown = true;
                    card.setPointerCapture(e.pointerId); // 鎖定指標路徑
                    card.classList.add('dragging');

                    // 點擊瞬間將其轉為絕對定位，以便跨越界線拖曳
                    if (card.style.position !== 'absolute') {
                        const rect = card.getBoundingClientRect();
                        const padRect = pad.getBoundingClientRect();
                        origLeft = rect.left - padRect.left;
                        origTop = rect.top - padRect.top;
                        
                        card.style.position = 'absolute';
                        card.style.left = origLeft + 'px';
                        card.style.top = origTop + 'px';
                    } else {
                        origLeft = parseFloat(card.style.left);
                        origTop = parseFloat(card.style.top);
                    }

                    startX = e.clientX;
                    startY = e.clientY;

                    studentRef.update({ isDragging: true, card: card.getAttribute('data-val') });
                });

                card.addEventListener('pointermove', (e) => {
                    if (!isPointerDown) return;
                    e.preventDefault();

                    let deltaX = e.clientX - startX;
                    let deltaY = e.clientY - startY;

                    let newX = origLeft + deltaX;
                    let newY = origTop + deltaY;

                    // 限制左右不跑出框外
                    if(newX < 0) newX = 0;
                    if(newX > pad.clientWidth - card.clientWidth) newX = pad.clientWidth - card.clientWidth;
                    // 頂部允許往上滑出框外以進行「發射」判定
                    if(newY > pad.clientHeight - card.clientHeight) newY = pad.clientHeight - card.clientHeight;

                    card.style.left = newX + 'px';
                    card.style.top = newY + 'px';

                    // 同步大螢幕映射座標
                    studentRef.update({
                        x: newX * 2.2 + 50, 
                        y: newY * 1.2 + 100
                    });
                });

                const endHandler = (e) => {
                    if (!isPointerDown) return;
                    isPointerDown = false;
                    card.releasePointerCapture(e.pointerId);
                    card.classList.remove('dragging');

                    const val = card.getAttribute('data-val');
                    // 向上發射判定：若拖曳至控制框的上方邊界外
                    if (parseInt(card.style.top) < 20) {
                        if (currentQuizAns.includes(val)) {
                            studentRef.update({ success: true, isDragging: false });
                            document.getElementById('msg').style.color = '#2e7d32';
                            document.getElementById('msg').innerText = "❤️ 答對了！太厲害了！";
                        } else {
                            document.getElementById('msg').style.color = '#d32f2f';
                            document.getElementById('msg').innerText = "❌ 關代屬性選錯囉，再想想看！";
                            setTimeout(() => { document.getElementById('msg').innerText = ""; }, 2000);
                            resetCards();
                            studentRef.update({ isDragging: false });
                        }
                    } else {
                        resetCards();
                        studentRef.update({ isDragging: false });
                    }
                };

                card.addEventListener('pointerup', endHandler);
                card.addEventListener('pointercancel', endHandler);
            });
        }
    </script>
</body>
</html>
