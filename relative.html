<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文法解析：關係子句學習基地</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background-color: #f7f4eb; color: #1a1a1a; margin: 0; padding: 20px 15px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container {
            max-width: 950px; width: 100%; background: white; border: 3px solid #1a1a1a;
            border-radius: 16px; padding: 30px; box-shadow: 6px 6px 0px #1a1a1a; box-sizing: border-box;
        }
        h1 { text-align: center; margin-top: 0; text-shadow: 2px 2px 0px #ffd54f; font-size: 26pt; }
        .back-link { text-decoration: none; color: #0288d1; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        
        /* 1. 上：核心概念與講義區 */
        .grammar-box { background-color: #fafafa; border: 2px solid #1a1a1a; border-radius: 12px; padding: 20px; margin-bottom: 30px; }
        .antecedent { text-decoration: underline; font-weight: bold; }
        .relative-clause { background-color: #fff59d; padding: 2px 5px; border-radius: 4px; }
        
        /* 2. 中：全新改良版動態句子合併示範黑板 */
        .teaching-board {
            background-color: #263238; border: 4px solid #1a1a1a; border-radius: 12px;
            padding: 25px; margin-bottom: 30px; box-shadow: 4px 4px 0px #1a1a1a; color: white;
        }
        .teaching-board h3 { margin-top: 0; color: #ffd54f; border-bottom: 1px dashed #546e7a; padding-bottom: 8px; margin-bottom: 15px; }
        .guide-tip { color: #ce93d8; font-size: 11pt; margin: -5px 0 15px 0; font-weight: bold; }
        
        /* 預設兩行之上下鐵軌托盤 */
        .board-line {
            display: flex; gap: 12px; align-items: center; padding: 12px 20px;
            min-height: 70px; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box;
        }
        #line-a { background: #37474f; border: 2px dashed #4fc3f7; } /* 第一行主要句子軌道 */
        #line-b { background: #2d3d45; border: 2px dashed #ff8a80; } /* 第二行次要句子軌道 */
        
        .line-label { font-size: 11pt; font-weight: bold; background: #1a1a1a; color: #b0bec5; padding: 4px 8px; border-radius: 4px; min-width: 75px; text-align: center; user-select: none; }
        
        /* 磁鐵字塊樣式 */
        .block-token {
            padding: 10px 16px; font-size: 14pt; font-weight: bold; color: #1a1a1a;
            background: #fffde7; border: 2px solid #1a1a1a; border-radius: 6px;
            box-shadow: 2px 2px 0px #000; cursor: grab; user-select: none;
        }
        .block-token:active { cursor: grabbing; }
        .block-token.clause-style { background-color: #fff59d; border-color: #fbc02d; }
        .block-token.pronoun-style { background-color: #ffcdd2; cursor: pointer; }
