                const beforeSpan = document.createElement('span'); beforeSpan.className = 'antecedent'; beforeSpan.innerText = quiz.antecedent;
                const slotContainer = document.createElement('span'); slotContainer.className = 'slot-container'; slotContainer.id = 'interactive-container';
                const slotDiv = document.createElement('div'); slotDiv.className = 'slot'; slotDiv.id = 'target-slot'; slotDiv.innerText = '？';
                const skeletonSpan = document.createElement('span'); skeletonSpan.className = 'clause-skeleton'; skeletonSpan.innerText = quiz.clause;
                const afterSpan = document.createElement('span'); afterSpan.innerText = quiz.after;
                slotContainer.appendChild(slotDiv); slotContainer.appendChild(skeletonSpan);
                display.appendChild(beforeSpan); display.appendChild(slotContainer); display.appendChild(afterSpan);
            } else {
                const beforeSpan = document.createElement('span'); beforeSpan.innerText = quiz.before;
                const anteSpan = document.createElement('span'); anteSpan.className = 'antecedent'; anteSpan.innerText = quiz.antecedent;
                const slotContainer = document.createElement('span'); slotContainer.className = 'slot-container'; slotContainer.id = 'interactive-container';
                const slotDiv = document.createElement('div'); slotDiv.className = 'slot'; slotDiv.id = 'target-slot'; slotDiv.innerText = '？';
                const skeletonSpan = document.createElement('span'); skeletonSpan.className = 'clause-skeleton'; skeletonSpan.innerText = quiz.clause;
                slotContainer.appendChild(slotDiv); slotContainer.appendChild(skeletonSpan);
                display.appendChild(beforeSpan); display.appendChild(anteSpan); display.appendChild(slotContainer);
            }
        }

        const board = document.getElementById('board');
        roomRef.child('students').on('value', (snapshot) => {
            const students = snapshot.val();
            if (!students) return;
            updateScoreboard(students);

            Object.keys(students).forEach(id => {
                const data = students[id];
                let cardEl = document.getElementById('card-' + id);
                if (!cardEl && data.isDragging) {
                    cardEl = document.createElement('div'); cardEl.id = 'card-' + id; cardEl.className = 'sync-card'; board.appendChild(cardEl);
                }
                if (cardEl) {
                    if (data.isDragging) {
                        cardEl.style.display = 'flex'; cardEl.style.left = data.x + 'px'; cardEl.style.top = data.y + 'px';
                        cardEl.innerHTML = `<span>${data.card === 'who' ? '👤' : data.card === 'which' ? '👜' : '⭐'} ${data.card}</span><span class="owner-tag">${data.name}</span>`;
                        cardEl.style.backgroundColor = data.card === 'who' ? '#ffcdd2' : data.card === 'which' ? '#c8e6c9' : '#e1bee7';
                    } else { cardEl.style.display = 'none'; }
                }

                if (data.success && selectedQuizList.length > 0) {
                    const quiz = selectedQuizList[currentIdx];
                    if (quiz.type === 2) {
                        const slot = document.getElementById('target-slot');
                        if (slot && !slot.classList.contains('success')) {
                            slot.className = 'slot success'; slot.innerText = `[ ${quiz.before.trim() || '主詞'} ]`;
                            triggerWinner(data.name);
                        }
                    } else {
                        const container = document.getElementById('interactive-container');
                        if (container && !container.classList.contains('combined')) {
                            container.classList.add('combined');
                            container.innerHTML = `<span class="slot success">${data.card} ${quiz.clause}</span>`;
                            triggerWinner(data.name);
                        }
                    }
                }
            });
        });

        function triggerWinner(winnerName) {
            document.getElementById('winner-banner').innerText = `🏆 搶答成功！恭喜【${winnerName}】獲得 10 分！`;
            document.getElementById('winner-banner').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
            roomRef.update({ answered: true, winner: winnerName });
        }

        function updateScoreboard(students) {
            const scZone = document.getElementById('scoreboard-ui'); scZone.innerHTML = '';
            let scores = {};
            Object.keys(students).forEach(k => { scores[students[k].name] = students[k].score || 0; });
            globalScores = scores;
            let sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
            if(sorted.length === 0) { scZone.innerHTML = `<div style="color:#999;font-size:12pt;width:100%;text-align:center;">等待學生登入中...</div>`; return; }
            sorted.forEach((name, i) => {
                const pill = document.createElement('div'); pill.className = `score-pill ${i === 0 ? 'lead' : ''}`;
                pill.innerText = `${i === 0 ? '👑 ' : ''}${name}：${scores[name]} 分`; scZone.appendChild(pill);
            });
        }

        // 🌟 重點修正：切換下一題時，只精準更新狀態，絕對不移除整個學生註冊節點！
        document.getElementById('next-btn').addEventListener('click', () => {
            currentIdx++;
            if (currentIdx < 10) {
                syncQuestionToFirebase(currentIdx);
                roomRef.child('students').once('value', snap => {
                    const students = snap.val();
                    if(students) { 
                        Object.keys(students).forEach(k => { 
                            // 改用精確路徑更新個別欄位，保留學生的登入狀態
                            roomRef.child('students/' + k).update({ 
                                success: false, 
                                isDragging: false,
                                card: ""
                            }); 
                        }); 
                    }
                });
                renderQuestion(currentIdx);
            } else {
                roomRef.update({ isEnded: true });
                showFinalLeaderboard();
            }
        });

        function showFinalLeaderboard() {
            document.getElementById('next-btn').style.display = 'none';
            const display = document.getElementById('sentence-display');
            document.getElementById('q-progress').innerText = "🏁 競賽結束！最終成績結算排行";
            let html = `<div style="display:flex;flex-direction:column;align-items:center;width:100%;"><h2>🏆 關係子句魔法大賽・頒獎台 🏆</h2><table class="rank-table"><thead><tr><th>名次</th><th>組別 / 學生姓名</th><th>總得分</th></tr></thead><tbody>`;
            let sorted = Object.keys(globalScores).sort((a,b) => globalScores[b] - globalScores[a]);
            sorted.forEach((name, idx) => { html += `<tr><td>第 ${idx + 1} 名</td><td>${name}</td><td>${globalScores[name]} 分</td></tr>`; });
            html += `</tbody></table></div>`; display.innerHTML = html;
        }
    </script>
</body>
</html>
