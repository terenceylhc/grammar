<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關係子句魔法教室 - 大螢幕競賽端</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background-color: #f7f4eb; color: #1a1a1a; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }
        .header {
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center;
            background: #fff; border: 3px solid #1a1a1a; border-radius: 12px; padding: 10px 25px; box-shadow: 5px 5px 0px #1a1a1a;
        }
        .room-code-tag { font-size: 20pt; font-weight: bold; background: #ffd54f; padding: 8px 20px; border: 2px solid #1a1a1a; border-radius: 8px; }
        .main-board {
            width: 100%; max-width: 1100px; background: white; border: 3px solid #1a1a1a; border-radius: 16px;
            box-shadow: 6px 6px 0px #1a1a1a; margin-top: 20px; padding: 40px; min-height: 380px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .setup-panel { width: 100%; max-width: 600px; text-align: left; }
        .setup-panel h3 { margin-top: 20px; border-bottom: 2px solid #1a1a1a; padding-bottom: 5px;}
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .checkbox-label { font-size: 14pt; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .checkbox-label input { width: 20px; height: 20px; }
        .sentence-area { font-size: 26pt; line-height: 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 15px; text-align: center; }
        
        .antecedent { border-bottom: 4px dashed #e57373; padding: 0 6px; font-weight: bold; background-color: rgba(229, 115, 115, 0.08); }
        .slot-container { display: inline-flex; align-items: center; gap: 10px; }
        .slot {
            width: 140px; height: 65px; border: 4px dashed #4fc3f7; border-radius: 10px;
            background: #e1f5fe; display: inline-flex; justify-content: center; align-items: center;
            font-size: 18pt; color: #0288d1; font-weight: bold;
        }
        .slot-large { width: 450px; height: 65px; border: 4px dashed #81c784; background: #e8f5e9; color: #2e7d32; border-radius: 10px; display: inline-flex; justify-content: center; align-items: center; font-size: 16pt; font-weight: bold;}
        .clause-skeleton { font-size: 24pt; color: #a1a1a1; border: 2px dashed #ccc; padding: 2px 10px; border-radius: 8px; background: #fafafa; }
        
        .highlight-clause { background-color: #fff59d; border: 2px solid #fbc02d; padding: 2px 12px; border-radius: 8px; animation: pop 0.3s ease-out; }
        .slot.success {
            width: auto; height: auto; border: 3px solid #fbc02d; background-color: #fff59d;
            color: #1a1a1a; padding: 5px 15px; border-radius: 6px;
        }
        .winner-banner {
            font-size: 22pt; color: #2e7d32; font-weight: bold; margin-top: 20px;
            background: #e8f5e9; border: 2px solid #81c784; padding: 10px 30px; border-radius: 30px;
            display: none; animation: pop 0.3s ease-out;
        }
        .sync-card {
            position: absolute; padding: 10px 20px; font-size: 14pt; font-weight: bold;
            border: 2px solid #1a1a1a; border-radius: 12px; box-shadow: 3px 3px 0px #1a1a1a;
            background-color: #fff9c4; transition: left 0.1s linear, top 0.1s linear;
            pointer-events: none; z-index: 99;
        }
        .scoreboard-zone {
            width: 100%; max-width: 1100px; background: #fff; border: 3px solid #1a1a1a;
            border-radius: 12px; margin-top: 20px; padding: 15px; box-shadow: 4px 4px 0px #1a1a1a;
            display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px;
        }
        .score-pill { font-size: 14pt; font-weight: bold; background: #f1f1f1; border: 2px solid #1a1a1a; padding: 6px 15px; border-radius: 20px; min-width: 120px; text-align: center; }
        .score-pill.lead { background: #fff9c4; border-color: #fbc02d; }
        .rank-table { width: 100%; max-width: 500px; border-collapse: collapse; margin-top: 20px; font-size: 16pt;}
        .rank-table th, .rank-table td { border: 2px solid #1a1a1a; padding: 12px; text-align: center; }
        .rank-table th { background: #ffd54f; }
        .btn { background: #ffd54f; border: 2px solid #1a1a1a; border-radius: 8px; padding: 12px 35px; font-size: 14pt; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0px #1a1a1a; margin-top: 20px; }
        @keyframes pop { 0% { transform: scale(0.95); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">✨ 關係子句魔法教室 - 團體競賽大螢幕 ✨</h2>
        <div class="room-code-tag" id="room-display">房間號碼：生成中...</div>
    </div>

    <div class="main-board" id="board">
        <div class="setup-panel" id="setup-ui">
            <h2>⚙️ 課堂競賽設定</h2>
            <p style="color: #666;">系統將隨機由 90 題嚴選題庫中抽出 10 題。題型三已更換為全新「全子句拆解大師三選一」機制。</p>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" id="type-1" checked> 題型一：基礎關代填空 (已納入17、20新題型)</label>
                <label class="checkbox-label"><input type="checkbox" id="type-2" checked> 題型二：尋找修飾標靶 (一字字點選螢光筆玩法)</label>
                <label class="checkbox-label"><input type="checkbox" id="type-3" checked> 題型三：文法拆解大師 (整條關係子句三選一防錯版)</label>
            </div>
            <button class="btn" id="start-game-btn" style="width: 100%;">🎲 隨機抽出 10 題・開始比賽！</button>
        </div>

        <div class="game-play-ui" id="game-play-ui" style="display:none; width:100%; text-align:center;">
            <div style="font-size: 14pt; color: #888; margin-bottom: 15px;" id="q-progress">題目：0 / 10</div>
            <div id="sentence-display" class="sentence-area"></div>
            <div class="winner-banner" id="winner-banner">🏆 搶答成功！</div>
        </div>
    </div>

    <div class="scoreboard-zone" id="scoreboard-ui">
        <div style="color: #999; font-size: 12pt; width: 100%; text-align: center;">等待學生加入中...</div>
    </div>

    <button class="btn" id="next-btn" style="display:none;">下一題 ➔</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOyninxSDT04q1-L3FPWciybdfnJowIwE",
            authDomain: "fire-gamebase.firebaseapp.com",
            databaseURL: "https://fire-gamebase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fire-gamebase",
            storageBucket: "fire-gamebase.firebasestorage.app",
            messagingSenderId: "35029879593",
            appId: "1:35029879593:web:26a7810d1363a72920c538"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('room-display').innerText = `教室房號：${roomCode}`;
        const roomRef = database.ref('classrooms/' + roomCode);

        // 🌟 嚴格更新校對題庫：融入主任指定 17, 20 題，並全面重構題型三
        const totalPool = [
            // === 題型一 ===
            { type: 1, before: "Andrew lost ", antecedent: "the hat", clause: "was given by Sharon.", ans: ["which", "that"] },
            { type: 1, before: "My mom likes to watch ", antecedent: "dramas", clause: "talk about family matters.", ans: ["which", "that"] },
            { type: 1, before: "The boy ", antecedent: "the boy", after: " is my brother.", clause: "is standing by the door", ans: ["who", "that"], isEmbed: true },
            { type: 1, before: "I bought a book ", antecedent: "a book", clause: "has many beautiful pictures.", ans: ["which", "that"] },
            { type: 1, before: "The doctor ", antecedent: "the doctor", after: " was very kind.", clause: "treated my grandfather", ans: ["who", "that"], isEmbed: true },
            { type: 1, before: "They live in a house ", antecedent: "a house", clause: "is over one hundred years old.", ans: ["which", "that"] },
            { type: 1, before: "The singer ", antecedent: "the singer", after: " won the award.", clause: "sang the beautiful song", ans: ["who", "that"], isEmbed: true },
            { type: 1, before: "He bought a new car ", antecedent: "a car", clause: "runs on electricity.", ans: ["which", "that"] },
            { type: 1, before: "The teacher ", antecedent: "the teacher", after: " comes from Canada.", clause: "teaches us English", ans: ["who", "that"], isEmbed: true },
            { type: 1, before: "Look at the dog ", antecedent: "the dog", clause: "is barking at the mailman.", ans: ["which", "that"] },
            { type: 1, before: "The woman ", antecedent: "the woman", after: " is a famous lawyer.", clause: "lives next door", ans: ["who", "that"], isEmbed: true },
            { type: 1, before: "The restaurant ", antecedent: "the restaurant", clause: "serves delicious pizza closed early.", ans: ["which", "that"] },
            { type: 1, before: "I met a traveler ", antecedent: "a traveler", clause: "had just returned from Africa.", ans: ["who", "that"] },
            { type: 1, before: "The movie ", antecedent: "the movie", after: " was very scary.", clause: "we watched last night", ans: ["which", "that"], isEmbed: true },
            { type: 1, before: "The student ", antecedent: "the student", after: " got a perfect score.", clause: "studied the hardest", ans: ["who", "that"], isEmbed: true },
            { type: 1, before: "Please return the laptop ", antecedent: "the laptop", clause: "belongs to the office.", ans: ["which", "that"] },
            { type: 1, before: "The workers ", antecedent: "the workers", after: " demand higher wages.", clause: "built this tower", ans: ["who", "that"], isEmbed: true }, // 📌 新更換17題
            { type: 1, before: "The letters ", antecedent: "the letters", after: " arrived this morning.", clause: "were on the desk", ans: ["which", "that"], isEmbed: true },
            { type: 1, before: "I don't like people ", antecedent: "people", clause: "tell lies to their friends.", ans: ["who", "that"] },
            { type: 1, before: "The tree ", antecedent: "the tree", after: " blew down in the storm.", clause: "stood in front of the house", ans: ["which", "that"], isEmbed: true }, // 📌 新更換20題插入型
            { type: 1, before: "The children ", antecedent: "the children", after: " are playing in the park.", clause: "live in this neighborhood", ans: ["who", "that"], isEmbed: true },
            { type: 1, before: "She works for a company ", antecedent: "a company", clause: "makes medical equipment.", ans: ["which", "that"] },
            { type: 1, before: "The jacket ", antecedent: "the jacket", after: " is made of leather.", clause: "is hanging in the closet", ans: ["which", "that"], isEmbed: true },
            { type: 1, before: "The scientist ", antecedent: "the scientist", after: " gave an inspiring speech.", clause: "discovered the new virus", ans: ["who", "that"], isEmbed: true },
            { type: 1, before: "He tells stories ", antecedent: "stories", clause: "sound completely unbelievable.", ans: ["which", "that"] },
            { type: 1, before: "The river ", antecedent: "the river", after: " flows through the city is polluted.", clause: "runs behind the factory", ans: ["which", "that"], isEmbed: true },
            { type: 1, before: "The bakery ", antecedent: "the bakery", clause: "sells traditional French bread is very popular.", ans: ["which", "that"] },
            { type: 1, before: "The police arrested the thief ", antecedent: "the thief", clause: "stole the diamond ring.", ans: ["who", "that"] },
            { type: 1, before: "The bus ", antecedent: "the bus", after: " was completely full.", clause: "goes to the airport", ans: ["which", "that"], isEmbed: true },
            { type: 1, before: "The lady ", antecedent: "the lady", after: " waved hello to us.", clause: "was driving the red sports car", ans: ["who", "that"], isEmbed: true },

            // === 題型二 ===
            { type: 2, full: "The woman who is listening to music is an actress.", target: "who,is,listening,to,music" },
            { type: 2, full: "A crowd of people who gathered in the square were there for the event.", target: "who,gathered,in,the,square" },
            { type: 2, full: "I cannot find the keys which open the back door.", target: "which,open,the,back,door" },
            { type: 2, full: "The students who passed the English exam felt very happy.", target: "who,passed,the,English,exam" },
            { type: 2, full: "The multi-touch screen which was invented recently is amazing.", target: "which,was,invented,recently" },
            { type: 2, full: "The dynamic computer that fits inside a pocket is called a smartphone.", target: "that,fits,inside,a,pocket" },
            { type: 2, full: "Do you know the gentleman who is wearing a black suit?", target: "who,is,wearing,a,black,suit" },
            { type: 2, full: "The library which stands on the hill will be rebuilt.", target: "which,stands,on,the,hill" },
            { type: 2, full: "The cake that was made by my sister tasted sweet.", target: "that,was,made,by,my,sister" },
            { type: 2, full: "The monkeys which live in the mountain are very friendly.", target: "which,live,in,the,mountain" },
            { type: 2, full: "The report which was written by Tom contains many mistakes.", target: "which,was,written,by,Tom" },
            { type: 2, full: "The passengers who were injured in the accident were taken to the hospital.", target: "who,were,injured,in,the,accident" },
            { type: 2, full: "The store that sells organic food is always crowded.", target: "that,sells,organic,food" },
            { type: 2, full: "The artist who painted this beautiful mural is highly talented.", target: "who,painted,this,beautiful,mural" },
            { type: 2, full: "The package which arrived yesterday afternoon was for my dad.", target: "which,arrived,yesterday,afternoon" },
            { type: 2, full: "The guard who stands at the gate checks everyone's ID.", target: "who,stands,at,the,gate" },
            { type: 2, full: "The fruits that grow on this tree are not safe to eat.", target: "that,grow,on,this,tree" },
            { type: 2, full: "The website which provides online courses is free for students.", target: "which,provides,online,courses" },
            { type: 2, full: "The actor who played the main character won an Oscar.", target: "who,played,the,main,character" },
            { type: 2, full: "The heavy rain that caused the flash flood lasted for three hours.", target: "that,caused,the,flash,flood" },
            { type: 2, full: "The museum which displays ancient artifacts attracting many tourists.", target: "which,displays,ancient,artifacts" },
            { type: 2, full: "The teacher who coaches the basketball team is very strict.", target: "who,coaches,the,basketball,team" },
            { type: 2, full: "The machine that prints the labels is out of order.", target: "that,prints,the,labels" },
            { type: 2, full: "The flight which goes to New York has been delayed.", target: "which,goes,to,New,York" },
            { type: 2, full: "The uniform that is worn by the staff looks very elegant.", target: "that,is,worn,by,the,staff" },
            { type: 2, full: "The man who fixed our air conditioner was very professional.", target: "who,fixed,our,air,conditioner" },
            { type: 2, full: "The dog which won the competition is a golden retriever.", target: "which,won,the,competition" },
            { type: 2, full: "The bridge that connects the two islands is made of steel.", target: "that,connects,the,two,islands" },
            { type: 2, full: "The woman who is sitting near the window looks lonely.", target: "who,is,sitting,near,the,window" },
            { type: 2, full: "The flowers which bloom in spring look absolutely beautiful.", target: "which,bloom,in,spring" },

            // === 題型三：文法拆解大師 (全裝卸子句三選一版) ===
            { type: 3, raw1: "I bought a book.", raw2: "It has many beautiful pictures.", before: "I bought a book ", options: ["which has many beautiful pictures.", "who has many beautiful pictures.", "has many beautiful pictures."], ans: "which has many beautiful pictures." },
            { type: 3, raw1: "I know a girl.", raw2: "She speaks four languages.", before: "I know a girl ", options: ["who speaks four languages.", "which speaks four languages.", "speaks four languages."], ans: "who speaks four languages." },
            { type: 3, raw1: "This is the bus.", raw2: "It goes to the station.", before: "This is the bus ", options: ["which goes to the station.", "who goes to the station.", "goes to the station."], ans: "which goes to the station." },
            { type: 3, raw1: "The man cooked dinner.", raw2: "He is a famous chef.", before: "The man ", after: " is a famous chef.", options: ["who cooked dinner", "which cooked dinner", "cooked dinner"], ans: "who cooked dinner", isEmbed: true },
            { type: 3, raw1: "The computer belongs to Tom.", raw2: "It is expensive.", before: "The computer ", after: " is expensive.", options: ["which belongs to Tom", "who belongs to Tom", "belongs to Tom"], ans: "which belongs to Tom", isEmbed: true }
        ];

        let selectedQuizList = [];
        let currentIdx = 0;
        let globalScores = {}; 

        roomRef.set({ isStarted: false, currentQuestion: 0, answered: false, winner: "", currentAnsStr: "", currentType: 1, optionsStr: "", fullSentenceText: "" });

        document.getElementById('start-game-btn').addEventListener('click', () => {
            const allowT1 = document.getElementById('type-1').checked;
            const allowT2 = document.getElementById('type-2').checked;
            const allowT3 = document.getElementById('type-3').checked;

            let filteredPool = totalPool.filter(q => {
                if (q.type === 1 && allowT1) return true;
                if (q.type === 2 && allowT2) return true;
                if (q.type === 3 && allowT3) return true;
                return false;
            });

            if (filteredPool.length < 5) { alert('題庫符合題數太少，請多勾選題型！'); return; }
            filteredPool.sort(() => Math.random() - 0.5);
            selectedQuizList = filteredPool.slice(0, 10); // 隨機抽題

            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('game-play-ui').style.display = 'block';

            syncQuestionToFirebase(0);
            renderQuestion(0);
        });

        function syncQuestionToFirebase(idx) {
            const quiz = selectedQuizList[idx];
            
            let ansStr = "";
            let optsStr = "";
            
            if (quiz.type === 1) { ansStr = quiz.ans.join(','); }
            else if (quiz.type === 2) { ansStr = quiz.target; }
            else if (quiz.type === 3) { 
                ansStr = quiz.ans; 
                optsStr = quiz.options.join('##'); // 用雙井號隔開傳送選項
            }

            roomRef.update({
                isStarted: true,
                currentQuestion: idx,
                answered: false,
                winner: "",
                currentType: quiz.type,
                currentAnsStr: ansStr,
                optionsStr: optsStr,
                fullSentenceText: quiz.type === 2 ? quiz.full : (quiz.type === 3 ? `${quiz.raw1} / ${quiz.raw2}` : "")
            });
        }

        function renderQuestion(idx) {
            document.getElementById('winner-banner').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('q-progress').innerText = `競賽進度：第 ${idx + 1} / 10 題`;

            const quiz = selectedQuizList[idx];
            const display = document.getElementById('sentence-display');
            display.innerHTML = '';

            // 題型二：乾淨全句等待點亮
            if (quiz.type === 2) {
                display.innerText = quiz.full;
                return;
            }

            // 題型三：拆解大師大螢幕端呈現
            if (quiz.type === 3) {
                let rawPrompt = `<div style="font-size:18pt; color:#666; margin-bottom:10px;">請合併兩句：${quiz.raw1} / ${quiz.raw2}</div>`;
                let mainSentence = "";
                if(quiz.isEmbed) {
                    mainSentence = `<span>${quiz.before}</span><div class="slot-large" id="target-slot">？ 請由平板選取正確子句發射</div><span>${quiz.after}</span>`;
                } else {
                    mainSentence = `<span>${quiz.before}</span><div class="slot-large" id="target-slot">？ 請由平板選取正確子句發射</div>`;
                }
                display.innerHTML = rawPrompt + `<div style="display:flex; justify-content:center; align-items:center; flex-wrap:wrap;">${mainSentence}</div>`;
                return;
            }

            // 題型一：基礎填空
            if (quiz.isEmbed) {
                display.innerHTML = `<span>${quiz.before}</span><span class="antecedent">${quiz.antecedent}</span><span class="slot-container" id="interactive-container"><div class="slot" id="target-slot">？</div><span class="clause-skeleton">${quiz.clause}</span></span><span>${quiz.after}</span>`;
            } else {
                display.innerHTML = `<span>${quiz.before}</span><span class="antecedent">${quiz.antecedent}</span><span class="slot-container" id="interactive-container"><div class="slot" id="target-slot">？</div><span class="clause-skeleton">${quiz.clause}</span></span>`;
            }
        }

        roomRef.child('students').on('value', (snapshot) => {
            const students = snapshot.val();
            if (!students) return;
            updateScoreboard(students);

            Object.keys(students).forEach(id => {
                const data = students[id];
                if (data.success && selectedQuizList.length > 0) {
                    const quiz = selectedQuizList[currentIdx];
                    
                    if (quiz.type === 2) {
                        const display = document.getElementById('game-play-ui').querySelector('.sentence-area');
                        if (display && !display.querySelector('.highlight-clause')) {
                            const targetWords = quiz.target.split(',');
                            let finalHtml = quiz.full;
                            const clausePhrase = quiz.full.match(new RegExp(targetWords.join("[\\s,]+").replace(/[?.]/g, ""), "i"));
                            if (clausePhrase) {
                                finalHtml = quiz.full.replace(clausePhrase[0], `<span class="highlight-clause">${clausePhrase[0]}</span>`);
                            }
                            display.innerHTML = finalHtml;
                            triggerWinner(data.name);
                        }
                    } else if (quiz.type === 3) {
                        const slot = document.getElementById('target-slot');
                        if (slot && !slot.classList.contains('success')) {
                            slot.className = "highlight-clause";
                            slot.style.fontSize = "26pt";
                            slot.innerText = data.card; // 填入選對的整條子句
                            triggerWinner(data.name);
                        }
                    } else {
                        const container = document.getElementById('interactive-container');
                        if (container && !container.classList.contains('combined')) {
                            container.classList.add('combined');
                            container.innerHTML = `<span class="slot success">${data.card} ${quiz.clause}</span>`;
                            triggerWinner(data.name);
                        }
                    }
                }
            });
        });

        function triggerWinner(winnerName) {
            document.getElementById('winner-banner').innerText = `🏆 搶答成功！恭喜【${winnerName}】獲得 10 分！`;
            document.getElementById('winner-banner').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
            roomRef.update({ answered: true, winner: winnerName });
        }

        function updateScoreboard(students) {
            const scZone = document.getElementById('scoreboard-ui'); scZone.innerHTML = '';
            let scores = {};
            Object.keys(students).forEach(k => { scores[students[k].name] = students[k].score || 0; });
            globalScores = scores;
            let sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
            if(sorted.length === 0) { return; }
            sorted.forEach((name, i) => {
                const pill = document.createElement('div'); pill.className = `score-pill ${i === 0 ? 'lead' : ''}`;
                pill.innerText = `${i === 0 ? '👑 ' : ''}${name}：${scores[name]} 分`; scZone.appendChild(pill);
            });
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            currentIdx++;
