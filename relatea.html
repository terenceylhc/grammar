<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關係子句魔法教室 - 大螢幕競賽端</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src="quizpool.js"></script>
    <style>
        body {
            font-family: 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
            background-color: #f7f4eb; color: #1a1a1a; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;
        }
        .header {
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center;
            background: #fff; border: 3px solid #1a1a1a; border-radius: 12px; padding: 10px 25px; box-shadow: 5px 5px 0px #1a1a1a;
        }
        .room-code-tag { font-size: 20pt; font-weight: bold; background: #ffd54f; padding: 8px 20px; border: 2px solid #1a1a1a; border-radius: 8px; }
        .main-board {
            width: 100%; max-width: 1100px; background: white; border: 3px solid #1a1a1a; border-radius: 16px;
            box-shadow: 6px 6px 0px #1a1a1a; margin-top: 20px; padding: 40px; min-height: 380px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .setup-panel { width: 100%; max-width: 600px; text-align: left; }
        .setup-panel h3 { margin-top: 20px; border-bottom: 2px solid #1a1a1a; padding-bottom: 5px;}
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .checkbox-label { font-size: 14pt; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .checkbox-label input { width: 20px; height: 20px; }
        .sentence-area { font-size: 26pt; line-height: 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 15px; text-align: center; }
        
        .antecedent { border-bottom: 4px dashed #e57373; padding: 0 6px; font-weight: bold; background-color: rgba(229, 115, 115, 0.08); }
        .slot-container { display: inline-flex; align-items: center; gap: 10px; }
        .slot {
            width: 140px; height: 65px; border: 4px dashed #4fc3f7; border-radius: 10px;
            background: #e1f5fe; display: inline-flex; justify-content: center; align-items: center;
            font-size: 18pt; color: #0288d1; font-weight: bold;
        }
        .slot-large { width: 450px; height: 65px; border: 4px dashed #81c784; background: #e8f5e9; color: #2e7d32; border-radius: 10px; display: inline-flex; justify-content: center; align-items: center; font-size: 16pt; font-weight: bold;}
        .clause-skeleton { font-size: 24pt; color: #a1a1a1; border: 2px dashed #ccc; padding: 2px 10px; border-radius: 8px; background: #fafafa; }
        
        .highlight-clause { background-color: #fff59d; border: 2px solid #fbc02d; padding: 2px 12px; border-radius: 8px; animation: pop 0.3s ease-out; }
        .slot.success { width: auto; height: auto; border: 3px solid #fbc02d; background-color: #fff59d; color: #1a1a1a; padding: 5px 15px; border-radius: 6px; }
        
        .winner-banner { font-size: 22pt; color: #2e7d32; font-weight: bold; margin-top: 20px; background: #e8f5e9; border: 2px solid #81c784; padding: 10px 30px; border-radius: 30px; display: none; }
        .sync-card { position: absolute; padding: 10px 20px; font-size: 14pt; font-weight: bold; border: 2px solid #1a1a1a; border-radius: 12px; box-shadow: 3px 3px 0px #1a1a1a; background-color: #fff9c4; transition: left 0.1s linear, top 0.1s linear; pointer-events: none; z-index: 99; }
        .scoreboard-zone { width: 100%; max-width: 1100px; background: #fff; border: 3px solid #1a1a1a; border-radius: 12px; margin-top: 20px; padding: 15px; box-shadow: 4px 4px 0px #1a1a1a; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px; }
        .score-pill { font-size: 14pt; font-weight: bold; background: #f1f1f1; border: 2px solid #1a1a1a; padding: 6px 15px; border-radius: 20px; min-width: 120px; text-align: center; }
        .score-pill.lead { background: #fff9c4; border-color: #fbc02d; }
        
        .rank-table { width: 100%; max-width: 550px; border-collapse: collapse; margin-top: 25px; font-size: 16pt; box-shadow: 5px 5px 0px #1a1a1a; border: 3px solid #1a1a1a; border-radius: 12px; overflow: hidden; background: white;}
        .rank-table th, .rank-table td { border: 2px solid #1a1a1a; padding: 14px; text-align: center; }
        .rank-table th { background: #ffd54f; }
        .rank-table tr:nth-child(2) { background: #fffde7; font-weight: bold; font-size: 19pt; color: #b78103; }
        
        .btn { background: #ffd54f; border: 2px solid #1a1a1a; border-radius: 8px; padding: 12px 35px; font-size: 14pt; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0px #1a1a1a; margin-top: 20px; }
        @keyframes pop { 0% { transform: scale(0.95); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">✨ 關係子句魔法教室 - 團體競賽大螢幕 ✨</h2>
        <div class="room-code-tag" id="room-display">房間號碼：生成中...</div>
    </div>

    <div class="main-board" id="board">
        <div class="setup-panel" id="setup-ui">
            <h2>⚙️ 課堂競賽設定 (120 題終極聲光慶賀版)</h2>
            <p style="color: #666;">勾選開啟題型，點擊後系統會從外掛晶片庫隨機調配 10 題進行多樣化競技！</p>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" id="type-1" checked> 題型一：基礎關代填空 (who/which/that卡片發射)</label>
                <label class="checkbox-label"><input type="checkbox" id="type-2" checked> 題型二：尋找修飾標靶 (一字字點選螢光筆玩法)</label>
                <label class="checkbox-label"><input type="checkbox" id="type-3" checked> 題型三：文法拆解大師 (整條關係子句三選一防錯版)</label>
                <label class="checkbox-label"><input type="checkbox" id="type-4" checked> 題型四：高級排列組合 (磁鐵字塊語順大重組)</label>
            </div>
            <button class="btn" id="start-game-btn" style="width: 100%;">🎲 隨機抽出 10 題・開始比賽！</button>
        </div>

        <div class="game-play-ui" id="game-play-ui" style="display:none; width:100%; text-align:center;">
            <div style="font-size: 14pt; color: #888; margin-bottom: 15px;" id="q-progress">題目：0 / 10</div>
            <div id="sentence-display" class="sentence-area"></div>
            <div class="winner-banner" id="winner-banner">🏆 搶答成功！</div>
        </div>
    </div>

    <div class="scoreboard-zone" id="scoreboard-ui">
        <div style="color: #999; font-size: 12pt; width: 100%; text-align: center;">等待學生加入中...</div>
    </div>

    <button class="btn" id="next-btn" style="display:none;">下一題 ➔</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOyninxSDT04q1-L3FPWciybdfnJowIwE",
            authDomain: "fire-gamebase.firebaseapp.com",
            databaseURL: "https://fire-gamebase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fire-gamebase",
            storageBucket: "fire-gamebase.firebasestorage.app",
            messagingSenderId: "35029879593",
            appId: "1:35029879593:web:26a7810d1363a72920c538"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('room-display').innerText = `教室房號：${roomCode}`;
        const roomRef = database.ref('classrooms/' + roomCode);

        let selectedQuizList = [];
        let currentIdx = 0;
        let globalScores = {}; 
        let isRoundSettled = false; 

        roomRef.set({ isStarted: false, currentQuestion: 0, answered: false, winner: "", currentAnsStr: "", currentType: 1, optionsStr: "", fullSentenceText: "" });

        document.getElementById('start-game-btn').addEventListener('click', () => {
            const allowT1 = document.getElementById('type-1').checked;
            const allowT2 = document.getElementById('type-2').checked;
            const allowT3 = document.getElementById('type-3').checked;
            const allowT4 = document.getElementById('type-4').checked;

            let filteredPool = totalPool.filter(q => {
                if (q.type === 1 && allowT1) return true;
                if (q.type === 2 && allowT2) return true;
                if (q.type === 3 && allowT3) return true;
                if (q.type === 4 && allowT4) return true;
                return false;
            });

            if (filteredPool.length < 10) { alert('符合題數不足 10 題，請勾選更多題型！'); return; }
            filteredPool.sort(() => Math.random() - 0.5);
            selectedQuizList = filteredPool.slice(0, 10);

            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('game-play-ui').style.display = 'block';

            syncQuestionToFirebase(0);
            renderQuestion(0);
        });

        function syncQuestionToFirebase(idx) {
            isRoundSettled = false;
            const quiz = selectedQuizList[idx];
            let ansStr = ""; let optsStr = ""; let rawText = "";

            if (quiz.type === 1) { ansStr = quiz.ans.join(','); }
            else if (quiz.type === 2) { ansStr = quiz.target; rawText = quiz.full; }
            else if (quiz.type === 3) { ansStr = quiz.ans; optsStr = quiz.options.join('##'); rawText = `${quiz.raw1} / ${quiz.raw2}`; }
            else if (quiz.type === 4) { ansStr = quiz.ans; optsStr = quiz.tokens.join('##'); rawText = `${quiz.raw1} / ${quiz.raw2}`; }

            roomRef.update({
                isStarted: true, currentQuestion: idx, answered: false, winner: "",
                currentType: quiz.type, currentAnsStr: ansStr, optionsStr: optsStr, fullSentenceText: rawText
            });
        }

        function renderQuestion(idx) {
            document.getElementById('winner-banner').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('q-progress').innerText = `競賽進度：第 ${idx + 1} / 10 題`;

            const quiz = selectedQuizList[idx];
            const display = document.getElementById('sentence-display');
            display.innerHTML = '';

            if (quiz.type === 2) { display.innerText = quiz.full; return; }

            if (quiz.type === 3) {
                display.innerHTML = `<div style="font-size:18pt; color:#666; margin-bottom:10px;">請合併兩句：${quiz.raw1} / ${quiz.raw2}</div>` + 
                                    `<div style="display:flex; justify-content:center; align-items:center;"><span>${quiz.before}</span><div class="slot-large" id="target-slot">？ 請由平板選取正確子句</div>${quiz.isEmbed ? `<span>${quiz.after}</span>` : ''}</div>`;
                return;
            }

            if (quiz.type === 4) {
                display.innerHTML = `<div style="font-size:18pt; color:#666; margin-bottom:10px;">請重組句子：${quiz.raw1} / ${quiz.raw2}</div>` +
                                    `<div class="slot-large" id="target-slot" style="width:700px; height:80px; border-color:#ffd54f; background:#fffde7; color:#f57f17;">？ 等待學生平板進行語順排列重組</div>`;
                return;
            }

            if (quiz.isEmbed) {
                display.innerHTML = `<span>${quiz.before}</span><span class="antecedent">${quiz.antecedent}</span><span class="slot-container" id="interactive-container"><div class="slot" id="target-slot">？</div><span class="clause-skeleton">${quiz.clause}</span></span><span>${quiz.after}</span>`;
            } else {
                display.innerHTML = `<span>${quiz.before}</span><span class="antecedent">${quiz.antecedent}</span><span class="slot-container" id="interactive-container"><div class="slot" id="target-slot">？</div><span class="clause-skeleton">${quiz.clause}</span></span>`;
            }
        }

        roomRef.child('students').on('value', (snapshot) => {
            const students = snapshot.val(); if (!students) return;
            updateScoreboard(students);

            Object.keys(students).forEach(id => {
                const data = students[id];
                if (data.success && selectedQuizList.length > 0 && !isRoundSettled) {
                    isRoundSettled = true; 
                    const quiz = selectedQuizList[currentIdx];
                    const slot = document.getElementById('target-slot');
                    
                    let currentScore = data.score || 0;
                    roomRef.child(`students/${id}`).update({ score: currentScore + 10 });

                    if (quiz.type === 2) {
                        const display = document.getElementById('game-play-ui').querySelector('.sentence-area');
                        if (display) {
                            const targetWords = quiz.target.split(','); let finalHtml = quiz.full;
                            const clausePhrase = quiz.full.match(new RegExp(targetWords.join("[\\s,]+").replace(/[?.]/g, ""), "i"));
                            if (clausePhrase) { finalHtml = quiz.full.replace(clausePhrase[0], `<span class="highlight-clause">${clausePhrase[0]}</span>`); }
                            display.innerHTML = finalHtml; 
                        }
                    } else if (quiz.type === 4 || quiz.type === 3) {
                        if (slot) {
                            slot.className = "highlight-clause"; slot.style.fontSize = "24pt";
                            slot.innerText = quiz.type === 4 ? data.card.replace(/,/g, ' ') : data.card;
                        }
                    } else {
                        const container = document.getElementById('interactive-container');
                        if (container) {
                            container.classList.add('combined');
                            container.innerHTML = `<span class="slot success">${data.card} ${quiz.clause}</span>`;
                        }
                    }
                    triggerWinner(data.name);
                }
            });
        });

        function triggerWinner(winnerName) {
            document.getElementById('winner-banner').innerText = `🏆 搶答成功！恭喜【${winnerName}】獲得 10 分！`;
            document.getElementById('winner-banner').style.display = 'block'; document.getElementById('next-btn').style.display = 'block';
            roomRef.update({ answered: true, winner: winnerName });
            
            // 單題答對噴發微型小拉炮點綴
            confetti({ particleCount: 40, angle: 60, spread: 55, origin: { x: 0 } });
            confetti({ particleCount: 40, angle: 120, spread: 55, origin: { x: 1 } });
        }

        function updateScoreboard(students) {
            const scZone = document.getElementById('scoreboard-ui'); scZone.innerHTML = '';
            let scores = {}; Object.keys(students).forEach(k => { scores[students[k].name] = students[k].score || 0; });
            globalScores = scores; let sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
            if(sorted.length === 0) return;
            sorted.forEach((name, i) => {
                const pill = document.createElement('div'); pill.className = `score-pill ${i === 0 ? 'lead' : ''}`;
                pill.innerText = `${i === 0 ? '👑 ' : ''}${name}：${scores[name]} 分`; scZone.appendChild(pill);
            });
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            currentIdx++;
            if (currentIdx < selectedQuizList.length) {
                syncQuestionToFirebase(currentIdx);
                roomRef.child('students').once('value', snap => {
                    const students = snap.val();
                    if(students) { Object.keys(students).forEach(k => { roomRef.child('students/' + k).update({ success: false, card: "" }); }); }
                });
                renderQuestion(currentIdx);
            } else { 
                roomRef.update({ isEnded: true }); 
                showFinalLeaderboard(); 
            }
        });

        // 🌟 新增：瀏覽器數學合成「全場溫馨大歡呼與拉炮聲」晶片技術 (免載外部音檔)
        function playCheersAudio() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // 1. 合成全場拍手鼓掌聲 (模擬粉紅噪音濾波)
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(100 + Math.random() * 300, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                    }, i * 80);
                }

                // 2. 合成熱烈的歡呼音高口哨聲
                let oscMain = audioCtx.createOscillator();
                let gainMain = audioCtx.createGain();
                oscMain.type = 'sine';
                oscMain.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscMain.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                oscMain.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.5);
                gainMain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainMain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
                oscMain.connect(gainMain); gainMain.connect(audioCtx.destination);
                oscMain.start(); oscMain.stop(audioCtx.currentTime + 1.8);

            } catch (e) { console.log("音訊建立失敗，使用者尚未與網頁互動：", e); }
        }

        // 🌟 核心修正：結算大清點，並啟動全螢幕無限豪華拉炮與歡呼
        function showFinalLeaderboard() {
            document.getElementById('next-btn').style.display = 'none';
            const display = document.getElementById('game-play-ui').querySelector('.sentence-area');
            document.getElementById('q-progress').innerText = "🏁 競賽結束！最終成績結算排行";
            
            roomRef.child('students').once('value', (snapshot) => {
                const students = snapshot.val() || {};
                let finalScores = {};
                
                Object.keys(students).forEach(k => {
                    finalScores[students[k].name] = students[k].score || 0;
                });
                
                let sorted = Object.keys(finalScores).sort((a, b) => finalScores[b] - finalScores[a]);
                
                let html = `<div style="display:flex;flex-direction:column;align-items:center;width:100%;">
                                <h2>🏆 關係子句魔法大賽・頒獎台 🏆</h2>
                                <table class="rank-table">
                                    <thead>
                                        <tr>
                                            <th>名次</th>
                                            <th>組別姓名</th>
                                            <th>總得分</th>
                                        </tr>
                                    </thead>
                                    <tbody>`;
                                    
                sorted.forEach((name, idx) => {
                    let medal = idx === 0 ? '🥇 ' : (idx === 1 ? '🥈 ' : (idx === 2 ? '🥉 ' : ''));
                    html += `<tr>
                                <td>${medal}第 ${idx + 1} 名</td>
                                <td><strong>${name}</strong></td>
                                <td style="color:#d32f2f; font-weight:bold;">${finalScores[name]} 分</td>
                             </tr>`;
                });
                
                html += `</tbody></table></div>`;
                display.innerHTML = html;

                // 🚀 觸發 A：播放全場高潮歡呼聲
                playCheersAudio();

                // 🚀 觸發 B：啟動「連續 4 秒全螢幕無限噴發拉炮」特效
                let duration = 4 * 1000;
                let end = Date.now() + duration;

                (function frame() {
                    confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.8 } });
                    confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.8 } });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());
            });
        }
    </script>
</body>
</html>
